  <rect x="22" y="17" width="4" height="10" rx="1" fill="#00F59B" filter="url(#cq-glow)"/>
  
  <path d="M34 28 L34 20" stroke="#00F59B" stroke-width="2" stroke-linecap="round"/>
  <rect x="32" y="21" width="4" height="5" rx="1" fill="#00F59B"/>
  
